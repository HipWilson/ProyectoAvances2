{% extends 'base.html' %}
{% block title %}Login — TiendaDB{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">◈</div>
    <h1 class="login-title">TiendaDB</h1>
    <p class="login-sub">Sistema de inventario y ventas</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="username" required placeholder="usuario" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary full-width" style="margin-top:.5rem">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
